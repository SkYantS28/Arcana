```yaml
name: Build Arcana Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar dependências
        run: npm ci

      - name: Compilar aplicação web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK de teste
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Gerar pacote Android
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Disponibilizar arquivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: arcana-android-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
```
